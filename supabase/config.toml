# ───────────────────────────────────────────────
#  RelayID Network · minimal cloud-oriented cfg
#  (Mostly affects local dev via `supabase start`)
# ───────────────────────────────────────────────
project_id = "RelayID"

# ── API (PostgREST & GraphQL) ────────────────
[api]
enabled  = true
schemas  = ["public"]       # Expose only what you need
extra_search_path = ["public"]
max_rows = 1000             # Leave as-is

# NOTE: [api.tls] is omitted—Supabase Cloud already handles HTTPS.

# ── Database (local dev only) ────────────────
[db]
major_version = 15          # Keep in sync with cloud
# Ports default to 54322/54320 when you `supabase start`
# You can leave them out unless you need custom mapping.

# ── Auth (service/anon keys, no end-user sign-up) ─────────
[auth]
enabled                      = true
site_url                     = "https://relayid.refunite.org"
enable_signup                = false    # end-users can’t self-register
enable_anonymous_sign_ins    = false
jwt_expiry                   = 3600
jwt_secret                   = "env(SUPABASE_JWT_SECRET)"

# Everything else (email, captcha, SMS, MFA, ext providers) is omitted.

# ── Disabled / unused services ───────────────
[storage]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
